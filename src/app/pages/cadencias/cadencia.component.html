<app-menu></app-menu>

<div class="container-fluid">
  <h2><mat-icon>calendar_today</mat-icon> Cadências de Vendas</h2>

  <div class="actions">
    <button mat-raised-button color="primary" (click)="abrirModalCadastro()">Nova Cadência</button>
  </div>

  <section class="cadencias-salvas">
    <mat-accordion>
      <mat-expansion-panel *ngFor="let c of cadenciasSalvas">
        <mat-expansion-panel-header>
          <mat-panel-title>
            {{ c.nome }}
          </mat-panel-title>
          <mat-panel-description>
            {{ c.descricao }}
          </mat-panel-description>
        </mat-expansion-panel-header>

        <ul>
          <li *ngFor="let e of c.etapas">
            <strong>Dia {{ e.dia }}</strong> | Canal: {{ e.canal }} | Mensagem: {{ e.mensagem }}
          </li>
        </ul>
      </mat-expansion-panel>
    </mat-accordion>
  </section>
</div>
