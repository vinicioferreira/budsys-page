<h2 mat-dialog-title>{{ cadenciaId ? 'Editar Cadência' : 'Nova Cadência' }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Nome da Cadência</mat-label>
    <input matInput [(ngModel)]="cadencia.nome" placeholder="Informe o nome">
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Descrição</mat-label>
    <input matInput [(ngModel)]="cadencia.descricao" placeholder="Descrição da cadência">
  </mat-form-field>

  <h3>{{ etapaIndex !== null ? 'Editar Etapa' : 'Nova Etapa' }}</h3>

  <div class="etapa-fields">
    <mat-form-field appearance="fill">
      <mat-label>Dia</mat-label>
      <input matInput type="number" min="1" [(ngModel)]="novaEtapa.dia">
    </mat-form-field>
  </div>

  <div class="acoes-header">
    <h4>Ações do dia</h4>
    <app-button variant="outline" textButton="+ Adicionar ação" (click)="adicionarAcao()"></app-button>
  </div>

  <div class="acoes-lista" *ngFor="let acao of novaEtapa.acoes; let i = index">
    <div class="acao-card">
      <div class="acao-topo">
        <span class="acao-titulo">Ação {{ i + 1 }}</span>

        <button
          mat-icon-button
          color="warn"
          type="button"
          (click)="removerAcao(i)"
          [disabled]="novaEtapa.acoes.length === 1"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>

      <div class="linha-dupla">
        <mat-form-field appearance="fill">
          <mat-label>Canal</mat-label>
          <mat-select [(ngModel)]="acao.canal">
            <mat-option value="Telefone">Telefone</mat-option>
            <mat-option value="WhatsApp">WhatsApp</mat-option>
            <mat-option value="Email">Email</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Condição</mat-label>
          <mat-select [(ngModel)]="acao.condicao">
            <mat-option value="normal">Executar normalmente</mat-option>
            <mat-option value="se_nao_atender">Se não atender</mat-option>
            <mat-option value="se_nao_responder">Se não responder</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Mensagem</mat-label>
        <textarea matInput rows="3" [(ngModel)]="acao.mensagem"></textarea>
      </mat-form-field>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <app-button variant="outline" (click)="fechar()" textButton="Fechar"></app-button>
  <app-button [textButton]="cadenciaId ? 'Salvar Edição' : 'Criar Cadência'" (click)="salvarCadencia()"></app-button>
</mat-dialog-actions>
