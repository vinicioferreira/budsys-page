<h2 mat-dialog-title>
  {{ modoEdicao ? 'Editar Lead' : 'Novo Lead' }}
</h2>

<mat-dialog-content>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Nome do contato</mat-label>
    <input matInput [(ngModel)]="cliente.nome">
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Empresa</mat-label>
    <input matInput [(ngModel)]="cliente.empresa">
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>CNPJ</mat-label>
    <input matInput [(ngModel)]="cliente.cnpj" placeholder="00.000.000/0000-00">
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Email</mat-label>
    <input matInput [(ngModel)]="cliente.email">
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Telefone</mat-label>
    <input matInput [(ngModel)]="cliente.telefone">
  </mat-form-field>

  <div class="row-dois">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Cidade</mat-label>
      <input matInput [(ngModel)]="cliente.cidade">
    </mat-form-field>
    <mat-form-field appearance="fill" class="uf-field">
      <mat-label>UF</mat-label>
      <input matInput [(ngModel)]="cliente.uf" maxlength="2">
    </mat-form-field>
  </div>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Canal</mat-label>
    <mat-select [(ngModel)]="cliente.canal">
      <mat-option value="">Selecione</mat-option>
      <mat-option *ngFor="let c of listaCanais" [value]="c.nome || ''">
        {{ c.nome || '(Sem nome)' }}
      </mat-option>
    </mat-select>
  </mat-form-field>


  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Mensagem</mat-label>
    <input matInput [(ngModel)]="cliente.mensagem">
  </mat-form-field>

  <div class="contatar-em-section">
    <mat-form-field appearance="fill" class="contatar-em-field">
      <mat-label>Contatar em</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="cliente.contatarEm" placeholder="DD/MM/AAAA">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="atalhos-data">
      <button type="button" class="atalho-btn" (click)="definirData(3)">+3 meses</button>
      <button type="button" class="atalho-btn" (click)="definirData(6)">+6 meses</button>
      <button type="button" class="atalho-btn" (click)="definirData(12)">+1 ano</button>
      <button type="button" class="atalho-btn atalho-limpar" *ngIf="cliente.contatarEm"
        (click)="cliente.contatarEm = null">Limpar</button>
    </div>

    <mat-form-field appearance="fill" class="full-width" *ngIf="cliente.contatarEm">
      <mat-label>Observação (motivo / próximo passo)</mat-label>
      <textarea matInput [(ngModel)]="cliente.observacaoContatar" rows="2"></textarea>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <app-button variant="outline" textButton="Cancelar" (click)="fechar()"></app-button>
  <app-button textButton="Salvar" icon="save" (click)="salvar()"></app-button>
</mat-dialog-actions>
