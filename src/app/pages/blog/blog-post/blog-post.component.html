<section class="container post" *ngIf="post$ | async as p; else notFound">
  <h1>{{ p.title }}</h1>
  <p class="meta" *ngIf="p.publishedAt">{{ p.publishedAt.toDate() | date:'dd/MM/yyyy' }}</p>

  <img *ngIf="p.coverUrl" [src]="p.coverUrl" [alt]="p.title" class="cover" />

  <!-- Renders your HTML -->
  <div class="content" [innerHTML]="p.contentHtml"></div>
</section>

<ng-template #notFound>
  <section class="container">
    <h2>Post não encontrado.</h2>
  </section>
</ng-template>
