<h2 mat-dialog-title>Entre em contato</h2>

<mat-dialog-content>
  <form [formGroup]="contatoForm">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>E-mail</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Telefone</mat-label>
      <input matInput formControlName="telefone">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Empresa (Opcional)</mat-label>
      <input matInput formControlName="empresa">
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Mensagem</mat-label>
      <textarea matInput formControlName="mensagem"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <app-button variant="outline" textButton="Cancelar" (click)="fechar()"></app-button>
  <app-button textButton="Enviar" icon="send" [disabled]="!contatoForm.valid" (click)="enviar()"></app-button>
</mat-dialog-actions>
