<app-menu></app-menu>

<!-- LINHA 2 -->
<div class="agenda-header">
  <h2>
    <mat-icon>calendar_today</mat-icon>
    Agenda de Clientes
  </h2>

  <div class="agenda-toolbar">
    <div class="view-buttons">
      <app-button variant="outline" textButton="Mês"    [active]="view === 'month'" (click)="view = 'month'"></app-button>
      <app-button variant="outline" textButton="Semana" [active]="view === 'week'"  (click)="view = 'week'"></app-button>
      <app-button variant="outline" textButton="Dia"    [active]="view === 'day'"   (click)="view = 'day'"></app-button>
    </div>

    <div class="navigation-buttons">
      <button mat-icon-button (click)="previous()">
        <mat-icon>chevron_left</mat-icon>
      </button>

      <span class="view-title">{{ viewDate | date: 'MMMM yyyy' }}</span>

      <button mat-icon-button (click)="next()">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>
</div>

<div class="calendar-container">
  <div class="add-activity-form">
    <input type="text" placeholder="Título da atividade" [(ngModel)]="newTitle">
    <input type="date" [(ngModel)]="newDateStr">
    <input type="time" [(ngModel)]="newTimeStr">

    <div class="lead-autocomplete-wrap">
      <mat-icon class="lead-icon">person_search</mat-icon>
      <input
        class="lead-input"
        type="text"
        placeholder="Vincular lead (opcional)"
        [(ngModel)]="contatosBusca"
        (input)="filtrarContatos()"
        [matAutocomplete]="autoLead">
      <button *ngIf="contatoSelecionado" type="button" class="lead-clear" (click)="limparContato()">
        <mat-icon>close</mat-icon>
      </button>
      <mat-autocomplete #autoLead="matAutocomplete" (optionSelected)="selecionarContato($event.option.value)">
        <mat-option *ngFor="let c of contatosSugestoes" [value]="c">
          <span class="lead-option-nome">{{ c.nome }}</span>
          <span class="lead-option-empresa" *ngIf="c.empresa"> · {{ c.empresa }}</span>
        </mat-option>
      </mat-autocomplete>
    </div>

    <app-button textButton="Adicionar" icon="add" (click)="onAddActivity()"></app-button>
  </div>

  <div class="status-legenda">
    <span *ngFor="let status of statusList">
      <span class="dot" [style.background]="status.color"></span>
      {{ status.label }}
    </span>
  </div>

  <mwl-calendar-month-view *ngIf="view === 'month'" [viewDate]="viewDate" [events]="events"
    [cellTemplate]="monthCellTemplate" (dayClicked)="onDayClicked($event.day)">
  </mwl-calendar-month-view>

  <mwl-calendar-week-view *ngIf="view === 'week'" [viewDate]="viewDate" [events]="events"
    (eventClicked)="handleEvent($event.event)">
  </mwl-calendar-week-view>

  <mwl-calendar-day-view *ngIf="view === 'day'" [viewDate]="viewDate" [events]="events"
    (eventClicked)="handleEvent($event.event)">
  </mwl-calendar-day-view>

  <ng-template #monthCellTemplate let-day="day">
    <div class="custom-month-cell" [class.expanded]="isDayExpanded(day)">
      <div class="custom-month-header" (click)="onDayClicked(day)">
        <span class="custom-month-day">
          {{ day.date | calendarDate:'monthViewDayNumber':locale }}
        </span>
      </div>

      <div class="custom-month-body">
        <ng-container *ngFor="let grupo of getGroupedEvents(day.events); let i = index">
          <div class="empresa-group" *ngIf="isDayExpanded(day) || i < 3">

            <div class="empresa-group__header">
              <span class="empresa-group__name" [title]="grupo.empresa">
                {{ grupo.empresa }}
              </span>
              <span class="empresa-group__count">
                {{ grupo.items.length }}
              </span>
            </div>

            <div class="empresa-group__chips">
              <button type="button" class="canal-chip" *ngFor="let item of grupo.items | slice: 0 : 2"
                [title]="item.labelCompleta" [style.border-left-color]="item.color"
                (click)="onEventChipClick($event, item.event)">
                {{ item.labelCurta }}
              </button>

              <span class="canal-chip canal-chip--more" *ngIf="grupo.items.length > 2">
                +{{ grupo.items.length - 2 }}
              </span>
            </div>
          </div>
        </ng-container>

        <button type="button" class="empresa-group empresa-group--more clickable"
          *ngIf="!isDayExpanded(day) && getGroupedEvents(day.events).length > 3"
          (click)="toggleDayExpansion(day, $event)">
          +{{ getGroupedEvents(day.events).length - 3 }} empresas
        </button>

        <button type="button" class="empresa-group empresa-group--more clickable"
          *ngIf="isDayExpanded(day) && getGroupedEvents(day.events).length > 3"
          (click)="toggleDayExpansion(day, $event)">
          Ver menos
        </button>
      </div>
    </div>
  </ng-template>
